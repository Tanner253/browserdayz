<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>ZONA — survive the infected, play to earn</title>
    <meta name="description" content="ZONA is a survival shooter that runs in your browser. Loot, fight other survivors and the infected, take a dog tag, stay alive ten minutes and cash it in." />
    <meta name="theme-color" content="#0d100c" />
    <link rel="icon" type="image/svg+xml" href="/brand/zona-mark.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/icon-32.png" />
    <link rel="apple-touch-icon" href="/brand/icon-180.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ZONA" />
    <meta property="og:title" content="ZONA — survive the infected, play to earn" />
    <meta property="og:description" content="A survival shooter in your browser. Loot, fight other survivors and the infected, take a dog tag, stay alive ten minutes and cash it in." />
    <meta property="og:url" content="https://www.zonapvp.fun/" />
    <meta property="og:image" content="https://www.zonapvp.fun/brand/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@zonaSOL_" />
    <meta name="twitter:image" content="https://www.zonapvp.fun/brand/og.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="ui"></div>
    <div id="rotate" role="alert">
      <div class="rot-phone"></div>
      <b>Rotate your phone</b>
      <span>ZONA plays in landscape</span>
      <button id="rotate-go">Tap to turn the screen</button>
      <p id="rotate-hint">Nothing happening when you turn it? Tap the button.</p>
    </div>
    <div id="loading">
      <div class="load-inner">
        <img class="load-mark" src="/brand/zona-mark-plain.svg" alt="" width="132" height="132" />
        <div class="load-title">ZONA</div>
        <div class="load-sub">survive the infected · play to earn</div>
        <div class="load-bar"><div class="load-fill"></div></div>
        <div class="load-label">initialising</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
