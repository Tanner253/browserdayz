<!doctype html>
<html><head><meta charset="utf-8"><title>ZONA ad, montage, 1.91:1</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1200px;height:628px;background:#0b0d0c;color:#f1eee6;font-family:'Barlow Condensed',sans-serif;overflow:hidden;display:grid;grid-template-columns:470px 1fr}
.side{position:relative;padding:44px 34px 36px 46px;display:flex;flex-direction:column;justify-content:flex-end;gap:12px;background:linear-gradient(160deg,#141816,#0b0d0c)}
.kick{display:flex;align-items:center;gap:10px;font:700 14px 'JetBrains Mono',monospace;letter-spacing:.3em;text-transform:uppercase;color:#ffd35a}
.kick img{width:30px;height:30px}
.name{font-size:132px;font-weight:700;letter-spacing:.14em;line-height:.86}
.line{font-size:29px;font-weight:600;line-height:1.1}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
.chips span{font:700 12px 'JetBrains Mono',monospace;letter-spacing:.12em;text-transform:uppercase;padding:6px 9px;border:1.5px solid rgba(255,211,90,.55)}
.go{display:flex;align-items:center;gap:16px;margin-top:10px}
.go b{font-size:25px;font-weight:700;letter-spacing:.22em;padding:11px 28px;background:#ffd35a;color:#101211}
.go span{font:700 14px 'JetBrains Mono',monospace;letter-spacing:.16em}
.grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:4px;background:#0b0d0c}
.t{position:relative;background:center/cover no-repeat}
.t em{position:absolute;left:12px;bottom:11px;font:700 13px 'JetBrains Mono',monospace;font-style:normal;letter-spacing:.2em;text-transform:uppercase;padding:5px 9px;background:rgba(8,10,9,.78);color:#f1eee6}
.t em::before{content:'';display:inline-block;width:7px;height:7px;background:#ffd35a;margin-right:8px;vertical-align:1px}
</style></head><body>
<div class="side">
  <div class="kick"><img src="../public/brand/zona-mark.svg" alt="">PvP survival shooter</div>
  <div class="name">ZONA</div>
  <div class="line">One open world. Real players.<br>The infected. No second chances.</div>
  <div class="chips"><span>Free to play</span><span>In your browser</span><span>No sign-up</span><span>No download</span></div>
  <div class="go"><b>PLAY FREE</b><span>zonapvp.fun</span></div>
</div>
<div class="grid">
  <div class="t" style="background-image:url('google-ads/tiles/fight.jpg');background-position:50% 45%"><em>Real players</em></div>
  <div class="t" style="background-image:url('google-ads/tiles/infected.jpg')"><em>The infected</em></div>
  <div class="t" style="background-image:url('google-ads/tiles/drop.jpg');background-position:50% 30%"><em>Supply drops</em></div>
  <div class="t" style="background-image:url('google-ads/tiles/night.jpg')"><em>A fort to take</em></div>
</div>
</body></html>
