<!doctype html>
<html><head><meta charset="utf-8"><title>ZONA ad, montage, square</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1200px;height:1200px;background:#0b0d0c;color:#f1eee6;font-family:'Barlow Condensed',sans-serif;overflow:hidden;display:grid;grid-template-rows:770px 1fr}
.grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr 1fr;gap:5px}
.t{position:relative;background:center/cover no-repeat}
.t em{position:absolute;left:14px;bottom:13px;font:700 15px 'JetBrains Mono',monospace;font-style:normal;letter-spacing:.2em;text-transform:uppercase;padding:6px 10px;background:rgba(8,10,9,.78);color:#f1eee6}
.t em::before{content:'';display:inline-block;width:8px;height:8px;background:#ffd35a;margin-right:9px;vertical-align:1px}
.band{padding:30px 56px 40px;display:grid;grid-template-columns:auto 1fr;column-gap:44px;row-gap:14px;align-content:center;background:linear-gradient(180deg,#141816,#0b0d0c)}
.kick{grid-column:1/3;display:flex;align-items:center;gap:12px;font:700 17px 'JetBrains Mono',monospace;letter-spacing:.3em;text-transform:uppercase;color:#ffd35a}
.kick img{width:36px;height:36px}
.name{font-size:176px;font-weight:700;letter-spacing:.14em;line-height:.84;align-self:center}
.right{display:flex;flex-direction:column;gap:14px;justify-content:center}
.line{font-size:36px;font-weight:600;line-height:1.1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{font:700 14px 'JetBrains Mono',monospace;letter-spacing:.12em;text-transform:uppercase;padding:7px 11px;border:1.5px solid rgba(255,211,90,.55)}
.go{display:flex;align-items:center;gap:20px;margin-top:4px}
.go b{font-size:30px;font-weight:700;letter-spacing:.22em;padding:13px 34px;background:#ffd35a;color:#101211}
.go span{font:700 18px 'JetBrains Mono',monospace;letter-spacing:.16em}
</style></head><body>
<div class="grid">
  <div class="t" style="background-image:url('google-ads/tiles/fight.jpg');background-position:50% 45%"><em>Real players</em></div>
  <div class="t" style="background-image:url('google-ads/tiles/infected.jpg')"><em>The infected</em></div>
  <div class="t" style="background-image:url('google-ads/tiles/drop.jpg');background-position:50% 30%"><em>Supply drops</em></div>
  <div class="t" style="background-image:url('google-ads/tiles/sniper.jpg');background-position:40% 50%"><em>Loot your gear</em></div>
  <div class="t" style="background-image:url('google-ads/tiles/jeep.jpg')"><em>Drive the map</em></div>
  <div class="t" style="background-image:url('google-ads/tiles/night.jpg')"><em>A fort to take</em></div>
</div>
<div class="band">
  <div class="kick"><img src="../public/brand/zona-mark.svg" alt="">PvP survival shooter</div>
  <div class="name">ZONA</div>
  <div class="right">
    <div class="line">One open world. Real players.<br>No second chances.</div>
    <div class="chips"><span>Free to play</span><span>In your browser</span><span>No sign-up</span><span>No download</span></div>
    <div class="go"><b>PLAY FREE</b><span>zonapvp.fun</span></div>
  </div>
</div>
</body></html>
