<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ZONA: DEX paid</title>
<!-- A marketing card, 1600x900. Rendered to marketing/zona-dex-paid.png by scripts/card.mjs.
     The picture behind it is a frame of the game (the run at a supply drop, from the second trailer). -->
<style>
  :root { --gold: #ffd35a; --ink: #f3efe6; --dim: #d8cfb8; --dark: #0c0d0b; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1600px; height: 900px; overflow: hidden; background: var(--dark); }
  body { position: relative; font-family: 'Bahnschrift', 'Arial Narrow', 'Segoe UI', sans-serif; font-stretch: condensed; color: var(--ink); text-transform: uppercase; }
  /* the frame has film bars top and bottom: it is scaled so they fall outside the card */
  .shot { position: absolute; inset: 0; background: url('src-drop-run.jpg') no-repeat; background-size: 1959px 1102px; background-position: -246px -101px; filter: contrast(1.08) saturate(1.18) brightness(0.97); }
  .shade { position: absolute; inset: 0; background:
    linear-gradient(90deg, rgba(8, 9, 7, 0) 43%, rgba(8, 9, 7, 0.8) 56%, rgba(8, 9, 7, 0.95) 100%),
    linear-gradient(180deg, rgba(8, 9, 7, 0.55) 0%, rgba(8, 9, 7, 0) 22%, rgba(8, 9, 7, 0) 70%, rgba(8, 9, 7, 0.8) 100%); }
  .frame { position: absolute; inset: 22px; border: 2px solid rgba(243, 239, 230, 0.22); }

  .logo { position: absolute; left: 64px; top: 50px; font-size: 118px; font-weight: 700; line-height: 0.9; letter-spacing: 0.16em; text-shadow: 0 4px 30px rgba(0, 0, 0, 0.8); }
  .logo small { display: block; margin-top: 14px; font-size: 21px; font-weight: 500; letter-spacing: 0.44em; color: var(--dim); }

  .col { position: absolute; right: 62px; top: 178px; width: 744px; }
  .live { display: flex; align-items: center; gap: 14px; font-size: 25px; font-weight: 600; letter-spacing: 0.24em; white-space: nowrap; color: var(--dim); }
  .live i { width: 15px; height: 15px; border-radius: 50%; background: #8fd16b; box-shadow: 0 0 16px #8fd16b; }
  .live b { color: var(--ink); font-weight: 700; }

  .stamp { display: inline-flex; align-items: center; gap: 22px; margin: 36px 0 0 -4px; padding: 4px 30px 0 24px; border: 8px solid var(--gold); color: var(--gold); transform: rotate(-3.2deg); transform-origin: left center; box-shadow: 0 10px 50px rgba(0, 0, 0, 0.55), inset 0 0 0 3px rgba(12, 13, 11, 0.55); background: rgba(12, 13, 11, 0.5); }
  .stamp svg { width: 92px; height: 92px; flex: none; margin-top: -4px; }
  .stamp span { font-size: 122px; font-weight: 700; line-height: 1.02; letter-spacing: 0.035em; white-space: nowrap; }

  .ticker { margin-top: 46px; font-size: 36px; font-weight: 600; letter-spacing: 0.2em; }
  .ticker b { color: var(--gold); font-weight: 700; }
  .ticker span { color: var(--dim); }

  .ca { margin-top: 26px; padding: 18px 24px 20px; background: rgba(12, 13, 11, 0.82); border: 1px solid rgba(243, 239, 230, 0.26); border-left: 7px solid var(--gold); }
  .ca label { display: block; font-size: 19px; font-weight: 600; letter-spacing: 0.4em; color: var(--dim); }
  .ca code { display: block; margin-top: 8px; font-family: 'Cascadia Mono', 'Consolas', monospace; font-stretch: normal; font-size: 25.5px; letter-spacing: 0; text-transform: none; color: var(--ink); white-space: nowrap; }

  .socials { display: flex; gap: 20px; margin-top: 26px; }
  .socials div { display: flex; align-items: center; gap: 14px; padding: 13px 24px 11px; font-size: 31px; font-weight: 600; letter-spacing: 0.08em; text-transform: none; background: rgba(12, 13, 11, 0.82); border: 1px solid rgba(243, 239, 230, 0.26); }
  .socials svg { width: 28px; height: 28px; flex: none; margin-top: -3px; }
  .socials .site { color: #14110b; background: var(--gold); border-color: var(--gold); letter-spacing: 0.1em; text-transform: uppercase; }

  .foot { position: absolute; left: 64px; bottom: 52px; font-size: 23px; font-weight: 500; letter-spacing: 0.4em; color: var(--dim); text-shadow: 0 2px 12px #000; }
</style>
</head>
<body>
  <div class="shot"></div>
  <div class="shade"></div>
  <div class="frame"></div>

  <div class="logo">ZONA<small>PvP survival · in your browser</small></div>

  <div class="col">
    <div class="live"><i></i><span><b>Token deployed</b> · live on pump.fun</span></div>
    <div class="stamp">
      <svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="44" fill="none" stroke="currentColor" stroke-width="9"/><path d="M28 52l15 15 30-34" fill="none" stroke="currentColor" stroke-width="11" stroke-linecap="square"/></svg>
      <span>DEX paid!</span>
    </div>
    <div class="ticker"><b>$ZONA</b> <span>on Solana</span></div>
    <div class="ca"><label>Contract address</label><code>GvfAzdPF466PJsPJMzXQeX3TSqmJm9YxAG8xBJ6ypump</code></div>
    <div class="socials">
      <div><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M18.9 2H22l-6.8 7.8L23.2 22h-6.3l-4.9-6.9L6.3 22H3.2l7.3-8.3L.8 2h6.4l4.5 6.3L18.9 2zm-1.1 18h1.7L6.3 3.9H4.5L17.8 20z"/></svg>@zonaSOL_</div>
      <div class="site">www.zonapvp.fun</div>
    </div>
  </div>

  <div class="foot">Loot · Fight · Take their tag</div>
</body>
</html>
