<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ZONA: the desert</title>
<!-- An X card, 1600x900 (2026-10-19, marketing/plan-x-media.html). Rendered to marketing/zona-x-desert.png by:
     node scripts/card.mjs x-desert 1600 900
     The picture is the road past Peski from film 21 (the peski shot, a lens in a car alongside). The words are the map's:
     Peski, Karavan, Bereg and Mys tier 1, Blokpost tier 2 (src/sim/desert.ts DESERT_TIERS); a jeep stood by each
     (src/sim/vehicles.ts WEST_CARS; at Bereg and Mys it may be a police car). -->
<style>
  :root { --gold: #ffd35a; --ink: #f3efe6; --dim: #cfc6ae; --dark: #0c0d0b; --line: rgba(243, 239, 230, 0.2); --green: #9fe08a; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1600px; height: 900px; overflow: hidden; background: var(--dark); }
  body { position: relative; font-family: 'Bahnschrift', 'Arial Narrow', 'Segoe UI', sans-serif; font-stretch: condensed; color: var(--ink); text-transform: uppercase; }
  .shot { position: absolute; inset: 0; background: url('src-x-peski.jpg') no-repeat; background-size: 1600px 900px; background-position: center; filter: contrast(1.05) saturate(1.05); }
  .shade { position: absolute; inset: 0; background:
    linear-gradient(90deg, rgba(8, 9, 7, 0.97) 0%, rgba(8, 9, 7, 0.9) 40%, rgba(8, 9, 7, 0.25) 70%, rgba(8, 9, 7, 0) 100%),
    linear-gradient(180deg, rgba(8, 9, 7, 0.35) 0%, rgba(8, 9, 7, 0) 26%, rgba(8, 9, 7, 0) 72%, rgba(8, 9, 7, 0.7) 100%); }
  .frame { position: absolute; inset: 16px; border: 2px solid var(--line); }
  .logo { position: absolute; left: 64px; top: 54px; font-size: 46px; font-weight: 700; letter-spacing: 0.18em; line-height: 0.9; text-shadow: 0 4px 24px rgba(0, 0, 0, 0.8); }
  .logo small { display: block; margin-top: 8px; font-size: 13px; font-weight: 500; letter-spacing: 0.42em; color: var(--dim); }
  .head { position: absolute; left: 64px; top: 176px; width: 700px; }
  .head i { display: inline-block; padding: 6px 14px; font-style: normal; font-size: 18px; font-weight: 700; letter-spacing: 0.26em; color: #141109; background: var(--gold); }
  .head h1 { margin-top: 20px; font-size: 104px; font-weight: 700; line-height: 0.9; letter-spacing: 0.03em; }
  .head h1 em { font-style: normal; color: var(--gold); }
  .head p { margin-top: 24px; font-size: 27px; font-weight: 500; line-height: 1.32; letter-spacing: 0.02em; text-transform: none; color: var(--dim); }
  .head p b { color: var(--ink); font-weight: 700; }
  .rule { position: absolute; left: 64px; top: 600px; width: 700px; padding: 20px 26px 20px; background: rgba(12, 13, 11, 0.86); border: 1px solid var(--line); border-left: 8px solid var(--green); }
  .rule h3 { font-size: 30px; font-weight: 700; letter-spacing: 0.06em; color: var(--green); }
  .rule p { margin-top: 8px; font-size: 22px; font-weight: 500; line-height: 1.3; text-transform: none; color: var(--dim); }
  .rule p b { color: var(--ink); }
  .foot { position: absolute; left: 64px; right: 64px; bottom: 50px; display: flex; justify-content: space-between; font-size: 19px; font-weight: 600; letter-spacing: 0.2em; color: var(--dim); }
  .foot b { color: var(--gold); }
</style>
</head>
<body>
  <div class="shot"></div><div class="shade"></div><div class="frame"></div>
  <div class="logo">ZONA<small>PvP survival · in your browser</small></div>
  <div class="head">
    <i>The far west</i>
    <h1>Five new<br><em>places</em></h1>
    <p><b>Peski, Karavan, Bereg and Mys</b> (tier 1) and <b>Blokpost</b> (tier 2), across the desert between the beach and the red canyon. A car stands by each.</p>
  </div>
  <div class="foot"><span>X <b>@zonaSOL_</b></span><span><b>ZONAPVP.FUN</b></span></div>
</body>
</html>
