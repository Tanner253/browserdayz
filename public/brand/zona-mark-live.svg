<circle class="glow" cx="256" cy="264" r="256" fill="url(#lm-glow)"/>
<g color="#ffd35a"><g class="h h0"><g id="lm-g0" transform="translate(256 264)" fill="currentColor"><circle cx="0" cy="-92.4" r="126" mask="url(#lm-cut)"/><circle r="98.7" fill="none" stroke="currentColor" stroke-width="29.4" clip-path="url(#lm-m0)"/></g></g><g class="h h1"><g id="lm-g1" transform="translate(256 264)" fill="currentColor"><circle cx="80.02" cy="46.2" r="126" mask="url(#lm-cut)"/><circle r="98.7" fill="none" stroke="currentColor" stroke-width="29.4" clip-path="url(#lm-m1)"/></g></g><g class="h h2"><g id="lm-g2" transform="translate(256 264)" fill="currentColor"><circle cx="-80.02" cy="46.2" r="126" mask="url(#lm-cut)"/><circle r="98.7" fill="none" stroke="currentColor" stroke-width="29.4" clip-path="url(#lm-m2)"/></g></g></g>
<g class="hot" color="#ffe9a6"><use href="#lm-g0"/><use href="#lm-g1"/><use href="#lm-g2"/></g>
