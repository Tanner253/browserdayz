<circle class="puff p1" cx="256" cy="364" r="46" fill="url(#lm-gas)"/><circle class="puff p2" cx="256" cy="364" r="36" fill="url(#lm-gas)"/><circle class="puff p3" cx="256" cy="364" r="46" fill="url(#lm-gas)"/><circle class="puff p4" cx="256" cy="364" r="36" fill="url(#lm-gas)"/>
